[project]
name = "dual-franka-teleoperation"
version = "0.1.0"
description = "Paired Quest-controlled Panda teleoperation and lossless demonstration recording"
requires-python = ">=3.11"
# ROS dependencies are supplied by the existing Jazzy/Pixi workspace.
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["dual_franka*"]

[tool.setuptools.package-data]
"dual_franka.quest" = ["static/*.html", "static/*.js"]
